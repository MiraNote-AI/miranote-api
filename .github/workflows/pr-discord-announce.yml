# templates/pr-discord-announce.yml -- synced verbatim into each target repo
# as `.github/workflows/pr-discord-announce.yml` by sync-ai-docs.yml. Do not
# edit the synced copy; edit here. .github runs its own copy of the same
# workflow (.github/workflows/pr-discord-announce.yml); keep the two in step.
#
# Posts one message to MiraNote Discord #general when a PR is opened, as the
# team bot MiraBot (Discord REST API, no LLM). Needs the secret
# MIRABOT_DISCORD_TOKEN (an org secret covers every repo). When the secret is
# absent (not yet added, or a fork/Dependabot PR) the job logs a notice and
# exits 0; a Discord error is a warning. It never fails a PR.

name: Announce PR in Discord

on:
  pull_request:
    types: [opened]

permissions: {}

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post to #general as MiraBot
        env:
          BOT_TOKEN: ${{ secrets.MIRABOT_DISCORD_TOKEN }}
          CHANNEL_ID: "1502874671434043514"
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          REPO_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${BOT_TOKEN:-}" ]; then
            echo "::notice::MIRABOT_DISCORD_TOKEN is not available; skipping announce."
            exit 0
          fi
          # allowed_mentions.parse=[] keeps a title like "@everyone" inert.
          payload=$(jq -n \
            --arg t "$PR_TITLE" \
            --arg u "$PR_URL" \
            --arg a "$PR_AUTHOR" \
            --arg r "$REPO_NAME" \
            '{content: "New PR in **\($r)** by **\($a)**:\n**\($t)**\n\($u)",
              allowed_mentions: {parse: []}}')
          resp="$RUNNER_TEMP/discord-resp"
          http_code=$(curl -sS --max-time 30 -o "$resp" -w "%{http_code}" \
            -X POST "https://discord.com/api/v10/channels/${CHANNEL_ID}/messages" \
            -H "Authorization: Bot ${BOT_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$payload" || true)
          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "Discord accepted the message (HTTP $http_code)."
          else
            echo "::warning::Discord rejected the message (HTTP $http_code)."
            cat "$resp" || true
          fi
