# .github/workflows/accounts.yml -- repo-local (not synced from MiraNote-AI/.github).
# The accounts service's tests need a real Postgres (design 8.1: never
# SQLite), so they run here with a postgres:17 service container instead of
# in the offline matrix of tests.yml. Nothing leaves the runner.

name: Accounts

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  pytest:
    name: pytest (accounts, postgres 17)
    # Pinned like tests.yml: setup-python has no 3.9 on ubuntu 26.04, and
    # the code must stay 3.9-compatible.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: accounts_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A throwaway database inside the runner; the tests drop every table.
      ACCOUNTS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/accounts_test
      PYTHONPATH: .
    defaults:
      run:
        working-directory: poc/accounts
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # The same commands an operator runs, through the alembic CLI.
      - name: Migrations up, down and up again
        env:
          DATABASE_URL: ${{ env.ACCOUNTS_TEST_DATABASE_URL }}
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run pytest
        run: python -m pytest tests/ -v
