# .github/workflows/tests.yml -- repo-local (not synced from MiraNote-AI/.github).
# Runs the four offline pytest suites the verify-repo skill lists for this
# repo, so a PR's test result is visible without trusting a local run.
# Every model call is stubbed inside the suites: no network, no API keys.

name: Tests

on:
  pull_request:
  push:
    branches: [main, dev]

jobs:
  pytest:
    name: pytest (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # chatbot and retrieval run from the repo root, the other two from
          # their POC directory -- the same commands verify-repo gives.
          # chatbot's main.py refuses to import without LLM_API_KEY (a local
          # run reads it from poc/chatbot/.env); its tests stub every call,
          # so CI gives it a placeholder that is never sent anywhere.
          - suite: chatbot
            workdir: .
            tests: poc/chatbot/tests
            llm_key_placeholder: true
          - suite: retrieval
            workdir: .
            tests: poc/retrieval/tests
          - suite: voice-to-text
            workdir: poc/voice-to-text
            tests: tests/
          - suite: text-clean-expand
            workdir: poc/text-clean-expand
            tests: tests/
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'  # the code must stay Python 3.9-compatible

      # CPU-only torch: the suites never run a model, so the CUDA wheels
      # would only slow the install down.
      - name: Install the suite's requirements
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r poc/${{ matrix.suite }}/requirements.txt

      - name: Run pytest
        working-directory: ${{ matrix.workdir }}
        env:
          # The working directory, plus the repo root: every service
          # imports beta_auth from there.
          PYTHONPATH: .:${{ github.workspace }}
        run: |
          if [ "${{ matrix.llm_key_placeholder }}" = "true" ]; then
            export LLM_API_KEY=ci-placeholder-not-a-real-key
          fi
          python -m pytest ${{ matrix.tests }} -v
