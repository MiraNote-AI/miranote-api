# .github/workflows/tests.yml -- repo-local (not synced from MiraNote-AI/.github).
# Runs the offline pytest suite of every POC service, so a PR's test result
# is visible without trusting a local run.
# Every model call is stubbed inside the suites: no network, no API keys.

name: Tests

on:
  pull_request:
  push:
    branches: [main, dev]

# The jobs only read the code. The repo's default token can write, and each
# job installs and runs whatever versions PyPI serves that day.
permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.suite }})
    # Pinned: ubuntu-latest moved to 26.04, where setup-python has no 3.9
    # (the code must stay 3.9-compatible). 3.9 is still built for 24.04.
    runs-on: ubuntu-24.04
    # Each job takes a few minutes at most; a hang should not hold a runner
    # for GitHub's default of 6 hours.
    timeout-minutes: 15
    # ffmpeg comes from a static build, not apt: apt pulls ~50 packages from
    # the runner's Ubuntu mirror, and a slow mirror once outlasted this job's
    # 15 minutes (#124). The pin is a month-end build, which FFmpeg-Builds
    # keeps for two years (to about 2028-10). To move it, take a newer
    # month-end build's lgpl linux64 asset and its sha256 from
    # https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases.
    env:
      FFMPEG_URL: https://github.com/FFmpeg-Builds/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n8.1.3-27-g8dca1586f4-linux64-lgpl-8.1.tar.xz
      FFMPEG_SHA256: a64f3171e6ad1f7d358d28890a907ee478c331d1177ec696a93418f79ac3f1f3
    strategy:
      fail-fast: false
      matrix:
        include:
          # chatbot and retrieval run from the repo root, the others from
          # their POC directory -- the same commands verify-repo gives.
          # chatbot's main.py refuses to import without LLM_API_KEY (a local
          # run reads it from poc/chatbot/.env); its tests stub every call,
          # so CI gives it a placeholder that is never sent anywhere.
          # The repo-root tests/ (beta_auth: the token gate and the rate
          # limit) ride along: they run from the root and need only what
          # chatbot's requirements install.
          - suite: chatbot
            workdir: .
            tests: poc/chatbot/tests tests
            llm_key_placeholder: true
          - suite: retrieval
            workdir: .
            tests: poc/retrieval/tests
          # The YanYi client re-encodes uploads with ffmpeg, and its 9 tests
          # skip without it; one also reads the result back with ffprobe.
          - suite: voice-to-text
            workdir: poc/voice-to-text
            tests: tests/
            ffmpeg: true
          - suite: text-clean-expand
            workdir: poc/text-clean-expand
            tests: tests/
          - suite: photo-collections
            workdir: poc/photo-collections
            tests: tests/
          # The one 3.13 service: SAM-2 needs Python >= 3.10, and main.py
          # imports it at load. The suite still never loads a model.
          - suite: image-generation
            workdir: poc/image-generation
            tests: tests/
            python: '3.13'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python || '3.9' }}
        uses: actions/setup-python@v5
        with:
          # The code must stay Python 3.9-compatible, except image-generation.
          python-version: ${{ matrix.python || '3.9' }}
          cache: pip
          cache-dependency-path: poc/${{ matrix.suite }}/requirements.txt

      # CPU-only torch: the suites never run a model, so the CUDA wheels
      # would only slow the install down.
      - name: Install the suite's requirements
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r poc/${{ matrix.suite }}/requirements.txt

      # The runner image has no ffmpeg. A PR restores the copy saved by the
      # last push to its base branch; the key follows the checksum, so a new
      # pin starts fresh.
      - name: Restore ffmpeg from cache
        id: ffmpeg-cache
        if: matrix.ffmpeg
        uses: actions/cache@v5
        with:
          path: ~/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_SHA256 }}

      # A healthy download takes seconds. curl drops a stalled or crawling
      # one and the step limit backs it up, so a bad day fails here, by
      # name, not at the job's 15 minutes. No apt fallback: it would quietly
      # bring back the mirror this replaces.
      - name: Install ffmpeg
        if: matrix.ffmpeg
        timeout-minutes: 4
        run: |
          set -o pipefail
          bin="$HOME/ffmpeg"
          if [ "${{ steps.ffmpeg-cache.outputs.cache-hit }}" != "true" ]; then
            archive="$RUNNER_TEMP/ffmpeg.tar.xz"
            if ! curl -fsSL --retry 2 --retry-all-errors --connect-timeout 10 \
                --speed-limit 1000000 --speed-time 15 --max-time 60 \
                -o "$archive" "$FFMPEG_URL"; then
              echo "::error::Could not download ffmpeg (curl's reason is above). If the pinned build is gone, move FFMPEG_URL and FFMPEG_SHA256 in tests.yml to a newer month-end build."
              exit 1
            fi
            if ! echo "$FFMPEG_SHA256  $archive" | sha256sum --check --quiet -; then
              echo "::error::The ffmpeg download does not match FFMPEG_SHA256. A pinned build should never change: find out why before touching the checksum."
              exit 1
            fi
            # Only the two binaries the suite calls, not ffplay and the docs.
            top="$(basename "$FFMPEG_URL" .tar.xz)"
            mkdir -p "$bin"
            tar -xJf "$archive" -C "$bin" --strip-components=2 \
              "$top/bin/ffmpeg" "$top/bin/ffprobe"
            rm "$archive"
          fi
          "$bin/ffmpeg" -version | sed -n 1p
          "$bin/ffprobe" -version | sed -n 1p
          echo "$bin" >> "$GITHUB_PATH"

      - name: Run pytest
        working-directory: ${{ matrix.workdir }}
        env:
          # The working directory, plus the repo root: every service
          # imports beta_auth from there.
          PYTHONPATH: .:${{ github.workspace }}
        run: |
          if [ "${{ matrix.llm_key_placeholder }}" = "true" ]; then
            export LLM_API_KEY=ci-placeholder-not-a-real-key
          fi
          # Missing ffmpeg turns the YanYi tests into skips, and skips pass:
          # fail here instead.
          if [ "${{ matrix.ffmpeg }}" = "true" ]; then
            for tool in ffmpeg ffprobe; do
              command -v "$tool" || { echo "::error::$tool is not on PATH, so the YanYi tests would skip"; exit 1; }
            done
          fi
          python -m pytest ${{ matrix.tests }} -v
