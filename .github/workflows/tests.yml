# .github/workflows/tests.yml -- repo-local (not synced from MiraNote-AI/.github).
# Runs the offline pytest suite of every POC service, so a PR's test result
# is visible without trusting a local run.
# Every model call is stubbed inside the suites: no network, no API keys.

name: Tests

on:
  pull_request:
  push:
    branches: [main, dev]

# The jobs only read the code. The repo's default token can write, and each
# job installs and runs whatever versions PyPI serves that day.
permissions:
  contents: read

jobs:
  pytest:
    name: pytest (${{ matrix.suite }})
    # Pinned: ubuntu-latest moved to 26.04, where setup-python has no 3.9
    # (the code must stay 3.9-compatible). 3.9 is still built for 24.04.
    runs-on: ubuntu-24.04
    # Each job takes a few minutes at most; a hang should not hold a runner
    # for GitHub's default of 6 hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # chatbot and retrieval run from the repo root, the others from
          # their POC directory -- the same commands verify-repo gives.
          # chatbot's main.py refuses to import without LLM_API_KEY (a local
          # run reads it from poc/chatbot/.env); its tests stub every call,
          # so CI gives it a placeholder that is never sent anywhere.
          # The repo-root tests/ (beta_auth: the token gate and the rate
          # limit) ride along: they run from the root and need only what
          # chatbot's requirements install.
          - suite: chatbot
            workdir: .
            tests: poc/chatbot/tests tests
            llm_key_placeholder: true
          - suite: retrieval
            workdir: .
            tests: poc/retrieval/tests
          - suite: voice-to-text
            workdir: poc/voice-to-text
            tests: tests/
          - suite: text-clean-expand
            workdir: poc/text-clean-expand
            tests: tests/
          - suite: photo-collections
            workdir: poc/photo-collections
            tests: tests/
          # The one 3.13 service: SAM-2 needs Python >= 3.10, and main.py
          # imports it at load. The suite still never loads a model.
          - suite: image-generation
            workdir: poc/image-generation
            tests: tests/
            python: '3.13'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python || '3.9' }}
        uses: actions/setup-python@v5
        with:
          # The code must stay Python 3.9-compatible, except image-generation.
          python-version: ${{ matrix.python || '3.9' }}
          cache: pip
          cache-dependency-path: poc/${{ matrix.suite }}/requirements.txt

      # CPU-only torch: the suites never run a model, so the CUDA wheels
      # would only slow the install down.
      - name: Install the suite's requirements
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            -r poc/${{ matrix.suite }}/requirements.txt

      # The YanYi client re-encodes uploads with ffmpeg, and its 9 tests skip
      # without it. The runner image has none.
      - name: Install ffmpeg
        if: matrix.suite == 'voice-to-text'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run pytest
        working-directory: ${{ matrix.workdir }}
        env:
          # The working directory, plus the repo root: every service
          # imports beta_auth from there.
          PYTHONPATH: .:${{ github.workspace }}
        run: |
          if [ "${{ matrix.llm_key_placeholder }}" = "true" ]; then
            export LLM_API_KEY=ci-placeholder-not-a-real-key
          fi
          python -m pytest ${{ matrix.tests }} -v
